<!doctype html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Матрица доступа PERCo</title>
    <!-- Тема до отрисовки (без мигания): выбор пользователя или системная. -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem("perco-theme") || "system";
                var dark = t === "dark" ||
                    (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
                document.documentElement.dataset.theme = dark ? "dark" : "light";
            } catch (e) { }
        })();
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
